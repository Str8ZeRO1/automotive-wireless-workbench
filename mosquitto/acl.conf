# Str8Zero gateway ACL.
# "gateway" user: the Pi daemon (sniff or simulate) — publish-only on the
# telemetry topics, no need to subscribe to anything.
user gateway
topic write automotive/tpms/#
topic write automotive/sniff/#
topic write automotive/node/beacon
topic write automotive/command/#

# "iosapp" user: the SwiftUI client — subscribes to all telemetry, and may
# publish mode-switch / control messages the gateway listens for.
user iosapp
topic read automotive/tpms/#
topic read automotive/sniff/#
topic read automotive/node/beacon
topic write automotive/command/mode
