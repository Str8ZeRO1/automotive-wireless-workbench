# Str8Zero Automotive Wireless Workbench - local Mosquitto broker config
# Deployed on the Pi Zero. Bridges hardware/RF ingestion (and the simulator)
# to the iOS app over two listeners: plain TCP (for CocoaMQTT on the same
# LAN) and WebSocket (for any browser-based / remote-tunnel client).

persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice

# --- TCP listener for CocoaMQTT (iOS app on local Wi-Fi / hotspot) ---
listener 1883
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd

# --- WebSocket listener, same auth, for browser/remote tooling ---
listener 9001
protocol websockets
allow_anonymous false
password_file /etc/mosquitto/passwd

# --- TLS WebSocket listener (recommended if the gateway is reachable off
#     the local LAN, e.g. via Tailscale/WireGuard exit or port-forward) ---
# listener 8883
# protocol mqtt
# cafile /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key
# allow_anonymous false
# password_file /etc/mosquitto/passwd

# Keep retained messages small and bounded; telemetry is high-frequency
# and SwiftData on the client is the durable store, not the broker.
max_queued_messages 1000
message_size_limit 262144

# ACL: gateway daemons publish, iOS app subscribes. Edit acl.conf for
# finer-grained per-user rules once more than one gateway/client exists.
acl_file /etc/mosquitto/acl.conf
